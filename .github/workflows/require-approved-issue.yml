name: Require approved issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const match = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);

            if (!match) {
              core.setFailed(
                "PR body must link the approved proposal issue, e.g. 'Closes #123'. " +
                "See PULL_REQUEST_TEMPLATE.md."
              );
              return;
            }

            const issueNumber = Number(match[1]);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const labels = issue.labels.map((l) => (typeof l === "string" ? l : l.name));

            if (!labels.includes("approved")) {
              core.setFailed(`Linked issue #${issueNumber} is not labeled 'approved' yet.`);
              return;
            }

            console.log(`Linked to approved issue #${issueNumber}.`);
